<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA8214"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Geometric Luxury Monogram Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0B1220" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Architectural Stylized P with shopping bag cut -->
    <path d="M22 45V18H34C39.5228 18 44 22.4772 44 28C44 33.5228 39.5228 38 34 38H22" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="28" r="3" fill="url(#goldGrad)" />
    <!-- Luxury Sparkle / Diamond -->
    <path d="M46 14L47.5 18.5L52 20L47.5 21.5L46 26L44.5 21.5L40 20L44.5 18.5Z" fill="url(#goldGrad)" />
  </g>
  <!-- Wordmark -->
  <text x="82" y="47" font-family="'Playfair Display', serif" font-size="34" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">PRO<tspan fill="url(#goldGrad)" font-family="'Inter', sans-serif" font-weight="300" letter-spacing="3">SHOP</tspan></text>
  <text x="84" y="61" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="3.5" fill="#A0AEC0">THE CURATED MARKETPLACE</text>
</svg>
