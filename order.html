<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Order details | ProShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/luxury-proshop.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center gap-3">
      <a href="/" class="text-white text-decoration-none fw-bold">PROSHOP</a>
      <nav class="d-flex gap-3"><a class="text-white" href="/account.html">My account</a><a class="text-white" href="/shop.html">Shop</a></nav>
    </div>
  </header>
  <main class="container py-5" style="max-width: 900px">
    <a href="/account.html" class="small text-decoration-none">← Back to my account</a>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mt-3 mb-4">
      <div><span class="text-uppercase small text-secondary">Order details</span><h1 class="h2 mb-0">Order <span id="order-reference">…</span></h1></div>
      <span id="order-status" class="badge text-bg-secondary">Loading</span>
    </div>
    <div id="order-message" class="alert d-none" role="status" aria-live="polite"></div>
    <section id="order-content" class="card border-0 shadow-sm rounded-4 p-4 d-none">
      <div class="row g-4 mb-4">
        <div class="col-md-6"><h2 class="h6">Payment</h2><p id="payment-info" class="mb-0 text-muted"></p></div>
        <div class="col-md-6"><h2 class="h6">Delivery address</h2><p id="delivery-summary" class="mb-0 text-muted"></p></div>
      </div>
      <h2 class="h5">Items</h2>
      <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Quantity</th><th class="text-end">Price each</th></tr></thead><tbody id="order-items"></tbody></table></div>
      <div class="ms-auto text-end"><p class="mb-1 text-muted">Subtotal <span id="order-subtotal"></span></p><p id="order-discount-row" class="mb-1 text-success d-none">Discount <span id="order-discount"></span></p><p id="order-gift-row" class="mb-1 text-muted d-none">Gift packaging <span id="order-gift"></span></p><p class="mb-1 text-muted">Tax <span id="order-tax"></span></p><p class="h5">Total <span id="order-total"></span></p></div>
      <section id="order-actions" class="border-top pt-4 mt-3 d-none">
        <h2 class="h5">Manage this COD order</h2>
        <p class="small text-muted">You can update the delivery details or cancel while the order is unpaid.</p>
        <form id="delivery-form" class="row g-3">
          <div class="col-12"><label class="form-label" for="delivery-recipient">Recipient name</label><input class="form-control" id="delivery-recipient" name="recipient_name" maxlength="150" required></div>
          <div class="col-12"><label class="form-label" for="delivery-address">Address</label><input class="form-control" id="delivery-address" name="address" maxlength="300" required></div>
          <div class="col-md-4"><label class="form-label" for="delivery-city">City</label><input class="form-control" id="delivery-city" name="city" maxlength="120" required></div>
          <div class="col-md-4"><label class="form-label" for="delivery-region">State</label><input class="form-control" id="delivery-region" name="region" maxlength="120" required></div>
          <div class="col-md-4"><label class="form-label" for="delivery-postal">Postal code</label><input class="form-control" id="delivery-postal" name="postal_code" maxlength="24" required></div>
          <div class="col-12 d-flex flex-wrap gap-2"><button class="btn btn-dark" type="submit">Save delivery details</button><button class="btn btn-outline-danger" id="cancel-order-button" type="button">Cancel order</button></div>
        </form>
      </section>
    </section>
  </main>
  <script src="/static/js/order.js?v=order-details-v1" defer></script>
</body>
</html>
